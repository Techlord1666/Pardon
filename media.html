<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Media Library | Pardon By Grace</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: { "primary": "#061b0e", "accent": "#d4af37", "tertiary": "#171816" },
            fontFamily: { "serif": ["Noto Serif", "serif"], "sans": ["Manrope", "sans-serif"] }
          }
        }
      }
    </script>
    <style>
        .asymmetric-rounding { border-radius: 40px 10px 40px 10px; }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .admin-controls { display: none !important; }
        body.admin-mode .admin-controls { display: flex !important; }
        #adminBtn { opacity: 0.05; cursor: pointer; transition: 0.3s; }
        #adminBtn:hover { opacity: 1; color: #d4af37; }
        .sermon-card { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Layout for Sermon Card (Facebook group style) */
        .sermon-card-inner {
            display: flex;
            align-items: center; /* Vertically align items in the middle */
            gap: 1.5rem; /* Space between image and text */
        }
        .sermon-image-container {
            flex-shrink: 0; /* Prevent image from shrinking */
            width: 100px; /* Fixed width for the image */
            height: 100px; /* Fixed height for a square aspect ratio */
            border-radius: 1rem; /* Adjust rounding as desired */
            overflow: hidden; /* Hide overflow for rounding */
            position: relative; /* For play icon */
        }
        .sermon-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensure image covers the area */
        }
        .sermon-details {
            flex-grow: 1; /* Allow text content to take remaining space */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertically center content */
        }
        .sermon-header-and-button {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Push title/speaker left, button right */
            width: 100%; /* Take full width of details */
            flex-wrap: wrap; /* Allow buttons to wrap if too many on small screens */
            gap: 0.5rem; /* Gap between buttons/title */
        }
        .sermon-title-speaker {
            flex-grow: 1; /* Allow title/speaker to take up space */
            margin-right: 0.5rem; /* Space before download buttons */
            overflow: hidden; /* Prevent text from overflowing */
            text-overflow: ellipsis; /* Add ellipsis if text is too long */
            white-space: nowrap; /* Keep text on one line for ellipsis */
        }
        .sermon-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem; 
            flex-shrink: 0; /* Prevent buttons from shrinking */
        }
        /* Hide the play button overlay for this compact layout, or adjust its style */
        .sermon-image-container .absolute {
            display: none; /* Hide play icon for this compact layout */
        }
        /* Adjust specific text sizes for compact card */
        .sermon-details h3 {
            font-size: 1rem; /* Smaller title for compact card */
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }
        .sermon-details p {
            font-size: 0.85rem; /* Smaller speaker name */
            margin-bottom: 0;
            color: #9ca3af; /* A lighter gray for speaker */
        }
        .sermon-card .admin-controls {
             margin-top: 1rem;
             padding-top: 1rem;
        }
    </style>
</head>
<body class="bg-tertiary text-white font-sans overflow-x-hidden">

<!-- Navigation -->
<nav class="fixed top-0 w-full z-50 bg-tertiary/90 backdrop-blur-md border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2">
            <img src="logo.png" alt="PBG" class="h-10 w-auto" onerror="this.src='https://via.placeholder.com/40x40?text=PBG'">
            <span class="font-serif font-bold text-lg uppercase tracking-tighter">Pardon By Grace</span>
        </a>
        <div class="flex items-center gap-4">
             <button onclick="openUpload()" class="admin-controls bg-accent text-primary px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest">+ Add New</button>
             <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest hover:text-accent">Home</a>
        </div>
    </div>
</nav>

<main class="pt-32 pb-40 px-6 max-w-7xl mx-auto">
    <div class="text-center mb-16">
        <h1 class="text-4xl md:text-6xl font-serif mb-4">Sermon Library</h1>
        <p class="text-accent font-bold tracking-[0.3em] uppercase text-xs">Winning the lost at all cost</p>
    </div>

    <div id="sermonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <p id="emptyMsg" class="col-span-full text-center text-gray-500 py-20 italic">Loading sermons...</p>
    </div>
</main>

<footer class="py-20 border-t border-white/5 bg-black/20 text-center">
    <p class="text-gray-600 text-sm mb-4">© 2025 Pardon By Grace International Church</p>
    <button id="adminBtn" onclick="activateAdmin()" class="text-[10px] font-bold uppercase tracking-widest">[ Admin Access ]</button>
</footer>

<!-- FORM MODAL -->
<div id="uploadModal" class="modal">
    <div class="absolute inset-0 bg-black/95" onclick="closeModal()"></div>
    <div class="relative bg-tertiary border border-white/10 w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl">
        <h3 id="modalTitle" class="text-2xl font-serif mb-6 text-accent text-center">Add New Sermon</h3>
        <input type="hidden" id="editId">
        <div class="space-y-4">
            <input type="text" id="fTitle" placeholder="Sermon Title" class="w-full bg-white/5 border-white/10 rounded-xl px-4 py-3 text-white">
            <input type="text" id="fSpeaker" placeholder="Speaker Name" class="w-full bg-white/5 border-white/10 rounded-xl px-4 py-3 text-white">
            
            <!-- Cover Image Upload -->
            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Thumbnail Image</p>
                <input type="file" id="fImageUpload" accept="image/*" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
                <p id="currentImageName" class="text-gray-400 text-xs mt-2 italic"></p>
                <input type="hidden" id="fImageUrl" > <!-- To store the URL after upload -->
            </div>

            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Google Drive Video Link</p>
                <input type="text" id="fVideoLink" placeholder="Paste Google Drive Video Link" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
            </div>

            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Google Drive Audio Link (Optional)</p>
                <input type="text" id="fAudioLink" placeholder="Paste Google Drive Audio Link (MP3, M4A, etc.)" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
            </div>
            
            <button id="saveBtn" onclick="saveSermon()" class="w-full bg-accent text-primary py-4 rounded-xl font-bold uppercase tracking-widest mt-4">Save Sermon</button>
        </div>
    </div>
</div>

<script>
    // !! IMPORTANT !! Replace with YOUR Supabase project URL and PUBLIC_ANON_KEY
    const SUPABASE_URL = 'https://jzhpqxsneqjnggrfzksa.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6aHBxeHNuZXFqbmdncmZ6a3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTg5NDksImV4cCI6MjA5MjU5NDk0OX0.zi3hhcg61ptBkzZiePlyuHkwDRKlWlplexIQxT6CW6I';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // No activeDropdown variable needed for this direct button approach

    window.onload = loadSermons;

    // Converts Google Drive share links or Supabase storage URLs to direct image links
    function convertToDirectLink(url) {
        if (!url) return '';
        if (url.includes(SUPABASE_URL) && url.includes('/storage/v1/object/public/')) {
            return url; // Already a direct Supabase public URL
        }
        if (url.includes('drive.google.com')) {
            let id = '';
            if (url.includes('id=')) {
                id = url.split('id=')[1].split('&')[0];
            } else if (url.includes('/d/')) {
                id = url.split('/d/')[1].split('/')[0];
            }
            // This URL pattern often works for displaying publicly shared GDrive images
            return `https://lh3.googleusercontent.com/d/${id}`; 
        }
        return url; // Return as is if not GDrive or Supabase
    }

    // Extracts Google Drive file ID from various Google Drive URL formats
    function extractGoogleId(url) {
        if (!url || !url.includes('drive.google.com')) return "";
        try {
            if (url.includes('id=')) return url.split('id=')[1].split('&')[0];
            else if (url.includes('/d/')) return url.split('/d/')[1].split('/')[0];
            else if (url.includes('/uc?id=')) return url.split('/uc?id=')[1].split('&')[0]; // For direct download URLs
            else if (url.includes('file/d/')) return url.split('file/d/')[1].split('/')[0]; // Common share link format
        } catch (e) { 
            console.error("Error extracting Google Drive ID from URL:", url, e);
            return ""; 
        }
        return "";
    }

    // Fetches sermons from Supabase and renders them
    async function loadSermons() {
        console.log("Loading sermons from Supabase...");
        const { data, error } = await _supabase.from('sermons').select('*').order('created_at', { ascending: false });
        const grid = document.getElementById('sermonGrid');
        grid.innerHTML = ''; // Clear existing content

        if (error) {
            console.error("Error fetching sermons:", error);
            grid.innerHTML = `<p class="col-span-full text-center text-red-500 py-20 italic">Error loading sermons: ${error.message}</p>`;
        } else if (data && data.length > 0) {
            console.log("Fetched sermons:", data);
            data.forEach(s => renderCard(s));
        } else {
            console.log("No sermons found.");
            grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-20 italic">No sermons found.</p>';
        }
    }

    // Renders a single sermon card
    function renderCard(s) {
        const grid = document.getElementById('sermonGrid');
        const div = document.createElement('div');
        div.className = "bg-white/5 p-4 rounded-[2rem] border border-white/5 sermon-card"; 
        
        const finalThumbnail = convertToDirectLink(s.image_url);
        const videoDownloadId = extractGoogleId(s.video_link);
        const audioDownloadId = extractGoogleId(s.audio_link);

        // Generate Google Drive direct download links if IDs are available
        const videoDownloadUrl = videoDownloadId ? `https://drive.google.com/uc?export=download&id=${videoDownloadId}` : '#';
        const audioDownloadUrl = audioDownloadId ? `https://drive.google.com/uc?export=download&id=${audioDownloadId}` : '#';

        div.innerHTML = `
            <div class="sermon-card-inner">
                <a href="${s.video_link}" target="_blank" rel="noopener noreferrer" class="sermon-image-container">
                    <img src="${finalThumbnail}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/100x100?text=PBG'">
                </a>

                <div class="sermon-details">
                    <div class="sermon-header-and-button">
                        <div class="sermon-title-speaker">
                            <h3 class="font-serif">${s.title}</h3>
                            <p class="text-gray-500">${s.speaker}</p>
                        </div>
                        
                        <div class="sermon-actions">
                            ${videoDownloadId ? `<a href="${videoDownloadUrl}" target="_blank" rel="noopener noreferrer" class="bg-accent text-primary px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:opacity-90 transition">Video</a>` : ''}
                            ${audioDownloadId ? `<a href="${audioDownloadUrl}" target="_blank" rel="noopener noreferrer" class="bg-accent text-primary px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:opacity-90 transition">Audio</a>` : ''}
                            ${!videoDownloadId && !audioDownloadId ? '<span class="text-gray-500 text-xs px-2 py-1">No downloads</span>' : ''}
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-controls mt-4 gap-2 border-t border-white/5 pt-4">
                <button onclick="openEdit('${s.id}', \`${s.title}\`, \`${s.speaker}\`, \`${s.image_url}\`, \`${s.video_link}\`, \`${s.audio_link || ''}\`)" class="flex-1 text-[10px] font-bold text-gray-400 hover:text-white transition">Edit</button>
                <button onclick="deleteSermon('${s.id}')" class="flex-1 text-[10px] font-bold text-red-400 hover:text-red-600 transition">Delete</button>
            </div>
        `;
        grid.appendChild(div);
    }

    // Handles image file upload to Supabase Storage
    async function uploadImage(file) {
        if (!file) {
            console.warn("No file selected for upload.");
            return null;
        }

        const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
        console.log("Attempting to upload image:", fileName);
        const { data, error } = await _supabase.storage
            .from('sermon-thumbnails') // Ensure this bucket exists in Supabase Storage
            .upload(fileName, file, {
                cacheControl: '3600',
                upsert: false // Set to true if you want to overwrite existing files with the same name
            });

        if (error) {
            console.error('Error uploading image to Supabase Storage:', error);
            alert('Error uploading image: ' + error.message);
            return null;
        }
        
        const { data: publicUrlData } = _supabase.storage
            .from('sermon-thumbnails')
            .getPublicUrl(fileName);

        console.log("Image uploaded, public URL:", publicUrlData.publicUrl);
        return publicUrlData.publicUrl;
    }

    // Saves or updates a sermon record in Supabase
    async function saveSermon() {
        const id = document.getElementById('editId').value;
        const videoLink = document.getElementById('fVideoLink').value;
        const audioLink = document.getElementById('fAudioLink').value;
        const imageFile = document.getElementById('fImageUpload').files[0];
        let imageUrl = document.getElementById('fImageUrl').value; // Existing URL if no new upload

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Uploading & Saving...";
        btn.disabled = true; // Disable button during upload/save

        if (!document.getElementById('fTitle').value || !document.getElementById('fSpeaker').value || !videoLink) {
            alert("Please fill in Sermon Title, Speaker Name, and Video Link.");
            btn.innerText = "Save Sermon";
            btn.disabled = false;
            return;
        }

        // If a new image file is selected, upload it
        if (imageFile) {
            imageUrl = await uploadImage(imageFile);
            if (!imageUrl) {
                btn.innerText = "Save Sermon";
                btn.disabled = false;
                return; // Stop if image upload failed
            }
        }
        // If no new image and no existing URL, use a placeholder
        if (!imageUrl) {
            imageUrl = 'https://via.placeholder.com/400x225?text=No+Image'; // Default placeholder if no image
            console.warn("No image URL provided or uploaded, using placeholder.");
        }


        const payload = {
            title: document.getElementById('fTitle').value,
            speaker: document.getElementById('fSpeaker').value,
            video_link: videoLink, 
            audio_link: audioLink, 
            image_url: imageUrl,
            video_download_id: extractGoogleId(videoLink),
            audio_download_id: extractGoogleId(audioLink)
        };

        console.log("Saving sermon payload:", payload);
        let result;
        if (id) {
            result = await _supabase.from('sermons').update(payload).eq('id', id);
        } else {
            result = await _supabase.from('sermons').insert([payload]);
        }

        if (result.error) {
            console.error("Supabase save error:", result.error);
            alert('Error saving sermon: ' + result.error.message);
            btn.innerText = "Save Sermon";
            btn.disabled = false;
        } else {
            console.log("Sermon saved successfully:", result.data);
            location.reload(); // Reload to show new/updated sermons
        }
    }

    // Activates admin mode with a password check
    function activateAdmin() {
        if (prompt("Enter Password:") === "pardonbygrace11") { // !! CHANGE THIS PASSWORD FOR PRODUCTION !!
            document.body.classList.add('admin-mode');
            alert("Admin Mode Active.");
        } else alert("Access Denied");
    }

    // Opens the upload/edit modal
    function openUpload() {
        document.getElementById('modalTitle').innerText = "Add New Sermon";
        document.getElementById('editId').value = "";
        clearForm();
        document.getElementById('currentImageName').innerText = ""; 
        document.getElementById('fImageUrl').value = ""; 
        document.getElementById('uploadModal').classList.add('active');
        document.getElementById('saveBtn').disabled = false; 
    }

    // Opens the modal for editing an existing sermon
    function openEdit(id, title, speaker, imgUrl, videoLink, audioLink) {
        document.getElementById('modalTitle').innerText = "Edit Sermon";
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = title;
        document.getElementById('fSpeaker').value = speaker;
        document.getElementById('fImageUrl').value = imgUrl; 
        document.getElementById('currentImageName').innerText = imgUrl ? `Current: ${imgUrl.split('/').pop().split('?')[0]}` : "No image uploaded yet.";
        document.getElementById('fVideoLink').value = videoLink;
        document.getElementById('fAudioLink').value = audioLink; 
        document.getElementById('fImageUpload').value = null; // Clear file input
        document.getElementById('uploadModal').classList.add('active');
        document.getElementById('saveBtn').disabled = false; 
    }

    // Deletes a sermon record from Supabase
    async function deleteSermon(id) {
        if (confirm("Delete this sermon?")) {
            console.log("Deleting sermon with ID:", id);
            const { error } = await _supabase.from('sermons').delete().eq('id', id);
            if (error) {
                console.error("Error deleting sermon:", error);
                alert('Error deleting sermon: ' + error.message);
            } else {
                console.log("Sermon deleted successfully.");
                location.reload();
            }
        }
    }

    // Closes any active modal
    function closeModal() {
        document.getElementById('uploadModal').classList.remove('active');
    }

    // Clears the form fields in the modal
    function clearForm() {
        ['fTitle','fSpeaker','fVideoLink','fAudioLink'].forEach(id => document.getElementById(id).value = "");
        document.getElementById('fImageUpload').value = ""; // Clear file input
    }

    // No openDownloadOptions or document.addEventListener('click') for dropdowns needed in this direct button approach

</script>

</body>
</html>
