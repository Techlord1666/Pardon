<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Media Library | Pardon By Grace</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: { "primary": "#061b0e", "accent": "#d4af37", "tertiary": "#171816" },
            fontFamily: { "serif": ["Noto Serif", "serif"], "sans": ["Manrope", "sans-serif"] }
          }
        }
      }
    </script>
    <style>
        .asymmetric-rounding { border-radius: 40px 10px 40px 10px; }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .admin-controls { display: none !important; }
        body.admin-mode .admin-controls { display: flex !important; }
        #adminBtn { opacity: 0.05; cursor: pointer; transition: 0.3s; }
        #adminBtn:hover { opacity: 1; color: #d4af37; }
        .sermon-card { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-tertiary text-white font-sans overflow-x-hidden">

<!-- Navigation -->
<nav class="fixed top-0 w-full z-50 bg-tertiary/90 backdrop-blur-md border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2">
            <img src="logo.png" alt="PBG" class="h-10 w-auto" onerror="this.src='https://via.placeholder.com/40x40?text=PBG'">
            <span class="font-serif font-bold text-lg uppercase tracking-tighter">Pardon By Grace</span>
        </a>
        <div class="flex items-center gap-4">
             <button onclick="openUpload()" class="admin-controls bg-accent text-primary px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest">+ Add New</button>
             <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest hover:text-accent">Home</a>
        </div>
    </div>
</nav>

<main class="pt-32 pb-40 px-6 max-w-7xl mx-auto">
    <div class="text-center mb-16">
        <h1 class="text-4xl md:text-6xl font-serif mb-4">Sermon Library</h1>
        <p class="text-accent font-bold tracking-[0.3em] uppercase text-xs">Winning the lost at all cost</p>
    </div>

    <div id="sermonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <p id="emptyMsg" class="col-span-full text-center text-gray-500 py-20 italic">Loading sermons...</p>
    </div>
</main>

<footer class="py-20 border-t border-white/5 bg-black/20 text-center">
    <p class="text-gray-600 text-sm mb-4">© 2025 Pardon By Grace International Church</p>
    <button id="adminBtn" onclick="activateAdmin()" class="text-[10px] font-bold uppercase tracking-widest">[ Admin Access ]</button>
</footer>

<!-- FORM MODAL -->
<div id="uploadModal" class="modal">
    <div class="absolute inset-0 bg-black/95" onclick="closeModal()"></div>
    <div class="relative bg-tertiary border border-white/10 w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl">
        <h3 id="modalTitle" class="text-2xl font-serif mb-6 text-accent text-center">Add New Sermon</h3>
        <input type="hidden" id="editId">
        <div class="space-y-4">
            <input type="text" id="fTitle" placeholder="Sermon Title" class="w-full bg-white/5 border-white/10 rounded-xl px-4 py-3 text-white">
            <input type="text" id="fSpeaker" placeholder="Speaker Name" class="w-full bg-white/5 border-white/10 rounded-xl px-4 py-3 text-white">
            
            <!-- THUMBNAIL BOX (Different Company/Link) -->
            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Thumbnail Image URL</p>
                <input type="text" id="fImage" placeholder="Paste Thumbnail Link (from other company)" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
            </div>

            <!-- SERMON LINK BOX (For Watch & Download) -->
            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Google Drive Sermon Link</p>
                <input type="text" id="fMasterLink" placeholder="Paste Google Drive Video Link" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
            </div>
            
            <button id="saveBtn" onclick="saveSermon()" class="w-full bg-accent text-primary py-4 rounded-xl font-bold uppercase tracking-widest mt-4">Save Sermon</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jzhpqxsneqjnggrfzksa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6aHBxeHNuZXFqbmdncmZ6a3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTg5NDksImV4cCI6MjA5MjU5NDk0OX0.zi3hhcg61ptBkzZiePlyuHkwDRKlWlplexIQxT6CW6I';
    
    // Improved Supabase Client Initialization
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.onload = loadSermons;

    function extractGoogleId(url) {
        if (!url || !url.includes('drive.google.com')) return url;
        try {
            if (url.includes('id=')) return url.split('id=')[1].split('&')[0];
            else if (url.includes('/d/')) return url.split('/d/')[1].split('/')[0];
        } catch (e) { return ""; }
        return "";
    }

    async function loadSermons() {
        try {
            const { data, error } = await _supabase.from('sermons').select('*').order('created_at', { ascending: false });
            const grid = document.getElementById('sermonGrid');
            grid.innerHTML = '';
            if (data && data.length > 0) {
                data.forEach(s => renderCard(s));
            } else {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-20 italic">No sermons found.</p>';
            }
        } catch (err) {
            console.error(err);
        }
    }

    function renderCard(s) {
        const grid = document.getElementById('sermonGrid');
        const div = document.createElement('div');
        div.className = "bg-white/5 p-4 rounded-[2rem] border border-white/5 sermon-card group relative";
        
        // Generate download URL from the ID
        const cleanId = extractGoogleId(s.view_link);
        const downloadUrl = `https://drive.google.com/uc?export=download&id=${cleanId}`;

        div.innerHTML = `
            <div class="relative overflow-hidden asymmetric-rounding aspect-video mb-6 bg-primary">
                <img src="${s.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/400x225?text=No+Thumbnail'">
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <span class="material-symbols-outlined text-5xl text-accent">play_circle</span>
                </div>
            </div>
            <h3 class="text-xl font-serif mb-1">${s.title}</h3>
            <p class="text-gray-500 text-sm mb-6">${s.speaker}</p>
            
            <div class="flex gap-2">
                <a href="${s.view_link}" target="_blank" class="flex-1 bg-accent text-primary text-center py-3 rounded-full text-[10px] font-bold uppercase">Watch / Listen</a>
                <a href="${downloadUrl}" class="bg-white/10 p-3 rounded-full hover:bg-white/20 transition">
                    <span class="material-symbols-outlined text-sm">download</span>
                </a>
            </div>

            <div class="admin-controls mt-4 gap-2 border-t border-white/5 pt-4">
                <button onclick="openEdit('${s.id}', \`${s.title}\`, \`${s.speaker}\`, \`${s.image_url}\`, \`${s.view_link}\`)" class="flex-1 text-[10px] font-bold text-gray-400">Edit</button>
                <button onclick="deleteSermon('${s.id}')" class="flex-1 text-[10px] font-bold text-red-400">Delete</button>
            </div>
        `;
        grid.appendChild(div);
    }

    async function saveSermon() {
        const id = document.getElementById('editId').value;
        const sermonLink = document.getElementById('fMasterLink').value;
        const imageUrl = document.getElementById('fImage').value;
        const title = document.getElementById('fTitle').value;

        if(!title || !sermonLink) {
            alert("Title and Sermon Link are required!");
            return;
        }

        const payload = {
            title: title,
            speaker: document.getElementById('fSpeaker').value,
            view_link: sermonLink,
            image_url: imageUrl, // Direct link from other company
            download_id: extractGoogleId(sermonLink)
        };

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Saving...";

        try {
            let result;
            if (id) {
                result = await _supabase.from('sermons').update(payload).eq('id', id);
            } else {
                result = await _supabase.from('sermons').insert([payload]);
            }

            if (result.error) throw result.error;
            location.reload();
        } catch (err) {
            alert("Error: " + err.message);
            btn.innerText = "Save Sermon";
        }
    }

    function activateAdmin() {
        if (prompt("Enter Password:") === "pardonbygrace11") {
            document.body.classList.add('admin-mode');
            alert("Admin Mode Active.");
        } else alert("Access Denied");
    }

    function openUpload() {
        document.getElementById('modalTitle').innerText = "Add New Sermon";
        document.getElementById('editId').value = "";
        clearForm();
        document.getElementById('uploadModal').classList.add('active');
    }

    function openEdit(id, title, speaker, img, view) {
        document.getElementById('modalTitle').innerText = "Edit Sermon";
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = title;
        document.getElementById('fSpeaker').value = speaker;
        document.getElementById('fImage').value = img;
        document.getElementById('fMasterLink').value = view;
        document.getElementById('uploadModal').classList.add('active');
    }

    async function deleteSermon(id) {
        if (confirm("Delete this sermon?")) {
            await _supabase.from('sermons').delete().eq('id', id);
            location.reload();
        }
    }

    function closeModal() { document.getElementById('uploadModal').classList.remove('active'); }
    function clearForm() {
        ['fTitle','fSpeaker','fImage','fMasterLink'].forEach(id => document.getElementById(id).value = "");
    }
</script>

</body>
</html>
