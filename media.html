<!DOCTYPE html>
<html class="light scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Media Library | Pardon By Grace</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet"/>
    
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: { "primary": "#061b0e", "accent": "#d4af37", "tertiary": "#171816" },
            fontFamily: { "serif": ["Noto Serif", "serif"], "sans": ["Manrope", "sans-serif"] }
          }
        }
      }
    </script>
    <style>
        .asymmetric-rounding { border-radius: 40px 10px 40px 10px; }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .admin-controls { display: none !important; }
        body.admin-mode .admin-controls { display: flex !important; }
        #adminBtn { opacity: 0.05; cursor: pointer; transition: 0.3s; }
        #adminBtn:hover { opacity: 1; color: #d4af37; }
        .sermon-card { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Styles for the download options dropdown */
        .download-options {
            position: absolute;
            background-color: #171816; /* tertiary */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem; /* rounded-[2rem] from card, adjusting for dropdown */
            padding: 0.75rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 50;
            bottom: 100%; /* Position above the download button */
            right: 0; /* Align to the right of the button */
            transform: translateY(-10px); /* Adjust position slightly */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease;
            min-width: 150px;
            text-align: right; /* Align text within dropdown */
        }
        .download-options.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .download-options a {
            display: block;
            padding: 0.5rem 0.75rem;
            color: #d4af37; /* accent */
            font-size: 0.75rem; /* text-[10px] */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em; /* tracking-widest */
            border-radius: 0.5rem;
            transition: background-color 0.2s ease;
        }
        .download-options a:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* NEW: Styling for the sermon card layout */
        .sermon-content-wrapper {
            display: flex;
            flex-direction: column; /* Default to column for small screens */
            gap: 1.5rem; /* Gap between image and text */
        }
        @media (min-width: 768px) { /* md breakpoint */
            .sermon-content-wrapper {
                flex-direction: row; /* Row for larger screens */
                align-items: flex-start; /* Align top */
            }
        }
        .sermon-image-container {
            width: 100%; /* Full width on small screens */
            flex-shrink: 0; /* Don't shrink image container */
        }
        @media (min-width: 768px) {
            .sermon-image-container {
                width: 40%; /* Take 40% width on larger screens */
                max-width: 200px; /* Limit image width */
            }
        }
        .sermon-details {
            flex-grow: 1; /* Allow text to take remaining space */
            display: flex;
            flex-direction: column;
        }
        .sermon-actions {
            display: flex;
            align-items: center;
            margin-top: auto; /* Push actions to the bottom */
            gap: 0.5rem;
        }
    </style>
</head>
<body class="bg-tertiary text-white font-sans overflow-x-hidden">

<!-- Navigation -->
<nav class="fixed top-0 w-full z-50 bg-tertiary/90 backdrop-blur-md border-b border-white/5">
    <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2">
            <img src="logo.png" alt="PBG" class="h-10 w-auto" onerror="this.src='https://via.placeholder.com/40x40?text=PBG'">
            <span class="font-serif font-bold text-lg uppercase tracking-tighter">Pardon By Grace</span>
        </a>
        <div class="flex items-center gap-4">
             <button onclick="openUpload()" class="admin-controls bg-accent text-primary px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest">+ Add New</button>
             <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest hover:text-accent">Home</a>
        </div>
    </div>
</nav>

<main class="pt-32 pb-40 px-6 max-w-7xl mx-auto">
    <div class="text-center mb-16">
        <h1 class="text-4xl md:text-6xl font-serif mb-4">Sermon Library</h1>
        <p class="text-accent font-bold tracking-[0.3em] uppercase text-xs">Winning the lost at all cost</p>
    </div>

    <div id="sermonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <p id="emptyMsg" class="col-span-full text-center text-gray-500 py-20 italic">Loading sermons...</p>
    </div>
</main>

<footer class="py-20 border-t border-white/5 bg-black/20 text-center">
    <p class="text-gray-600 text-sm mb-4">© 2025 Pardon By Grace International Church</p>
    <button id="adminBtn" onclick="activateAdmin()" class="text-[10px] font-bold uppercase tracking-widest">[ Admin Access ]</button>
</footer>

<!-- FORM MODAL -->
<div id="uploadModal" class="modal">
    <div class="absolute inset-0 bg-black/95" onclick="closeModal()"></div>
    <div class="relative bg-tertiary border border-white/10 w-full max-w-lg rounded-[2.5rem] p-8 shadow-2xl">
        <h3 id="modalTitle" class="text-2xl font-serif mb-6 text-accent text-center">Add New Sermon</h3>
        <input type="hidden" id="editId">
        <div class="space-y-4">
            <input type="text" id="fTitle" placeholder="Sermon Title" class="w-full bg-white/5 border-white/10 rounded-xl px-4 py-3 text-white">
            <input type="text" id="fSpeaker" placeholder="Speaker Name" class="w-full bg-white/5 border-white/10 rounded-xl px-4 py-3 text-white">
            
            <!-- Cover Image Upload -->
            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Thumbnail Image</p>
                <input type="file" id="fImageUpload" accept="image/*" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
                <p id="currentImageName" class="text-gray-400 text-xs mt-2 italic"></p>
                <input type="hidden" id="fImageUrl" > <!-- To store the URL after upload -->
            </div>

            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Google Drive Video Link</p>
                <input type="text" id="fVideoLink" placeholder="Paste Google Drive Video Link" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
            </div>

            <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                <p class="text-[10px] font-bold text-accent uppercase mb-2">Google Drive Audio Link (Optional)</p>
                <input type="text" id="fAudioLink" placeholder="Paste Google Drive Audio Link (MP3, M4A, etc.)" class="w-full bg-transparent border-none p-0 focus:ring-0 text-white text-sm">
            </div>
            
            <button id="saveBtn" onclick="saveSermon()" class="w-full bg-accent text-primary py-4 rounded-xl font-bold uppercase tracking-widest mt-4">Save Sermon</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://jzhpqxsneqjnggrfzksa.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp6aHBxeHNuZXFqbmdncmZ6a3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTg5NDksImV4cCI6MjA5MjU5NDk0OX0.zi3hhcg61ptBkzZiePlyuHkwDRKlWlplexIQxT6CW6I';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // Global variable to keep track of active dropdown
    let activeDropdown = null;

    window.onload = loadSermons;

    // --- NEW SMART IMAGE FIXER ---
    function convertToDirectLink(url) {
        if (!url) return '';
        // If it's a Supabase storage URL, directly return it.
        if (url.includes(SUPABASE_URL) && url.includes('/storage/v1/object/public/')) {
            return url;
        }
        // If it's a Google Drive link, convert it to a direct image link
        if (url.includes('drive.google.com')) {
            let id = '';
            if (url.includes('id=')) {
                id = url.split('id=')[1].split('&')[0];
            } else if (url.includes('/d/')) {
                id = url.split('/d/')[1].split('/')[0];
            }
            return `https://lh3.googleusercontent.com/d/${id}`; // This is a common pattern for public GDrive images
        }
        // If it's already a direct link (like from another company), leave it alone
        return url;
    }

    function extractGoogleId(url) {
        if (!url || !url.includes('drive.google.com')) return "";
        try {
            if (url.includes('id=')) return url.split('id=')[1].split('&')[0];
            else if (url.includes('/d/')) return url.split('/d/')[1].split('/')[0];
        } catch (e) { 
            console.error("Error extracting Google Drive ID:", e);
            return ""; 
        }
        return "";
    }

    async function loadSermons() {
        const { data, error } = await _supabase.from('sermons').select('*').order('created_at', { ascending: false });
        const grid = document.getElementById('sermonGrid');
        grid.innerHTML = '';
        if (data && data.length > 0) {
            data.forEach(s => renderCard(s));
        } else {
            grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-20 italic">No sermons found.</p>';
        }
    }

    function renderCard(s) {
        const grid = document.getElementById('sermonGrid');
        const div = document.createElement('div');
        div.className = "bg-white/5 p-4 rounded-[2rem] border border-white/5 sermon-card"; 
        
        const finalThumbnail = convertToDirectLink(s.image_url);
        const videoDownloadId = extractGoogleId(s.video_link);
        const audioDownloadId = extractGoogleId(s.audio_link);

        const videoDownloadUrl = videoDownloadId ? `https://drive.google.com/uc?export=download&id=${videoDownloadId}` : '#';
        const audioDownloadUrl = audioDownloadId ? `https://drive.google.com/uc?export=download&id=${audioDownloadId}` : '#';

        div.innerHTML = `
            <div class="sermon-content-wrapper">
                <div class="relative overflow-hidden asymmetric-rounding aspect-video bg-primary sermon-image-container group">
                    <img src="${finalThumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://via.placeholder.com/400x225?text=Image+Error'">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <span class="material-symbols-outlined text-5xl text-accent">play_circle</span>
                    </div>
                </div>

                <div class="sermon-details">
                    <h3 class="text-xl font-serif mb-1">${s.title}</h3>
                    <p class="text-gray-500 text-sm mb-6">${s.speaker}</p>
                    
                    <div class="sermon-actions relative mt-auto"> <!-- Added mt-auto to push to bottom if sermon-details grows -->
                        <a href="${s.video_link}" target="_blank" class="flex-1 bg-accent text-primary text-center py-3 rounded-full text-[10px] font-bold uppercase">Watch / Listen</a>
                        
                        <div class="relative"> <!-- Wrapper for download button and dropdown -->
                            <button onclick="openDownloadOptions(this, '${videoDownloadUrl}', '${audioDownloadUrl}')" class="bg-white/10 p-3 rounded-full hover:bg-white/20 transition relative z-20">
                                <span class="material-symbols-outlined text-sm">download</span>
                            </button>
                            <div class="download-options" id="downloadOptions-${s.id}">
                                ${videoDownloadId ? `<a href="${videoDownloadUrl}" target="_blank" rel="noopener noreferrer">Download Video</a>` : ''}
                                ${audioDownloadId ? `<a href="${audioDownloadUrl}" target="_blank" rel="noopener noreferrer">Download Audio</a>` : ''}
                                ${!videoDownloadId && !audioDownloadId ? '<span class="text-gray-500 text-xs px-2 py-1">No downloads available</span>' : ''}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-controls mt-4 gap-2 border-t border-white/5 pt-4">
                <button onclick="openEdit('${s.id}', \`${s.title}\`, \`${s.speaker}\`, \`${s.image_url}\`, \`${s.video_link}\`, \`${s.audio_link || ''}\`)" class="flex-1 text-[10px] font-bold text-gray-400 hover:text-white transition">Edit</button>
                <button onclick="deleteSermon('${s.id}')" class="flex-1 text-[10px] font-bold text-red-400 hover:text-red-600 transition">Delete</button>
            </div>
        `;
        grid.appendChild(div);
    }

    // --- NEW: Handle image file upload ---
    async function uploadImage(file) {
        if (!file) return null;

        const fileName = `${Date.now()}-${file.name.replace(/\s/g, '_')}`;
        const { data, error } = await _supabase.storage
            .from('sermon-thumbnails') // Create a bucket named 'sermon-thumbnails' in Supabase Storage
            .upload(fileName, file, {
                cacheControl: '3600',
                upsert: false
            });

        if (error) {
            alert('Error uploading image: ' + error.message);
            return null;
        }
        
        // Get public URL
        const { data: publicUrlData } = _supabase.storage
            .from('sermon-thumbnails')
            .getPublicUrl(fileName);

        return publicUrlData.publicUrl;
    }

    async function saveSermon() {
        const id = document.getElementById('editId').value;
        const videoLink = document.getElementById('fVideoLink').value;
        const audioLink = document.getElementById('fAudioLink').value; // New audio link field
        const imageFile = document.getElementById('fImageUpload').files[0];
        let imageUrl = document.getElementById('fImageUrl').value; // Get existing URL if no new upload

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Uploading & Saving...";
        btn.disabled = true; // Disable button during upload/save

        // If a new image file is selected, upload it
        if (imageFile) {
            imageUrl = await uploadImage(imageFile);
            if (!imageUrl) {
                btn.innerText = "Save Sermon";
                btn.disabled = false;
                return; // Stop if image upload failed
            }
        }
        // If no new image and no existing URL, maybe use a placeholder or error.
        // For now, we'll allow imageUrl to be empty if no upload and no previous image.

        const payload = {
            title: document.getElementById('fTitle').value,
            speaker: document.getElementById('fSpeaker').value,
            video_link: videoLink, 
            audio_link: audioLink, 
            image_url: imageUrl,
            video_download_id: extractGoogleId(videoLink),
            audio_download_id: extractGoogleId(audioLink)
        };

        let result;
        if (id) {
            result = await _supabase.from('sermons').update(payload).eq('id', id);
        } else {
            result = await _supabase.from('sermons').insert([payload]);
        }

        if (result.error) alert(result.error.message);
        else location.reload();
    }

    function activateAdmin() {
        if (prompt("Enter Password:") === "pardonbygrace11") {
            document.body.classList.add('admin-mode');
            alert("Admin Mode Active.");
        } else alert("Access Denied");
    }

    function openUpload() {
        document.getElementById('modalTitle').innerText = "Add New Sermon";
        document.getElementById('editId').value = "";
        clearForm();
        document.getElementById('currentImageName').innerText = ""; // Clear image name
        document.getElementById('fImageUrl').value = ""; // Clear hidden image URL
        document.getElementById('uploadModal').classList.add('active');
        document.getElementById('saveBtn').disabled = false; // Enable save button
    }

    function openEdit(id, title, speaker, imgUrl, videoLink, audioLink) {
        document.getElementById('modalTitle').innerText = "Edit Sermon";
        document.getElementById('editId').value = id;
        document.getElementById('fTitle').value = title;
        document.getElementById('fSpeaker').value = speaker;
        document.getElementById('fImageUrl').value = imgUrl; // Store the current image URL
        document.getElementById('currentImageName').innerText = imgUrl ? `Current: ${imgUrl.split('/').pop().split('?')[0]}` : "No image uploaded yet."; // Show current image name, remove query params
        document.getElementById('fVideoLink').value = videoLink;
        document.getElementById('fAudioLink').value = audioLink; // Set audio link
        document.getElementById('fImageUpload').value = null; // Clear file input
        document.getElementById('uploadModal').classList.add('active');
        document.getElementById('saveBtn').disabled = false; // Enable save button
    }

    async function deleteSermon(id) {
        if (confirm("Delete this sermon?")) {
            // Optional: You could also delete the image from Supabase Storage here if you store its path
            await _supabase.from('sermons').delete().eq('id', id);
            location.reload();
        }
    }

    function closeModal() {
        document.getElementById('uploadModal').classList.remove('active');
        // Close any active download dropdowns when modal closes
        if (activeDropdown) {
            activeDropdown.classList.remove('active');
            activeDropdown = null;
        }
    }

    function clearForm() {
        ['fTitle','fSpeaker','fVideoLink','fAudioLink'].forEach(id => document.getElementById(id).value = "");
        document.getElementById('fImageUpload').value = ""; // Clear file input
    }

    // --- Download options dropdown ---
    function openDownloadOptions(buttonElement, videoUrl, audioUrl) {
        // Find the closest parent div that wraps both the button and its dropdown
        const downloadOptionsWrapper = buttonElement.closest('.relative'); 
        const dropdown = downloadOptionsWrapper.querySelector('.download-options');

        // Close currently active dropdown if it's not this one
        if (activeDropdown && activeDropdown !== dropdown) {
            activeDropdown.classList.remove('active');
        }

        dropdown.classList.toggle('active');
        activeDropdown = dropdown.classList.contains('active') ? dropdown : null;

        // Prevent immediate closing if clicked again
        event.stopPropagation();
    }

    // Close dropdowns if clicked outside
    document.addEventListener('click', function(event) {
        // Ensure the click is not inside an active dropdown or on a button that triggers one
        if (activeDropdown && !activeDropdown.contains(event.target) && !event.target.closest('.sermon-actions .relative button')) {
            activeDropdown.classList.remove('active');
            activeDropdown = null;
        }
    });

</script>

</body>
</html>
